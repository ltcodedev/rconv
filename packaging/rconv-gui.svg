<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-grad)" stroke="#313244" stroke-width="6"/>

  <!-- Glow / Accent element -->
  <g filter="url(#shadow)">
    <!-- Film Reel / Clapper Frame -->
    <rect x="112" y="112" width="288" height="288" rx="48" ry="48" fill="none" stroke="url(#primary-grad)" stroke-width="24"/>
    
    <!-- Film sprocket holes left & right -->
    <rect x="136" y="148" width="20" height="28" rx="6" fill="#89b4fa" opacity="0.8"/>
    <rect x="136" y="242" width="20" height="28" rx="6" fill="#89b4fa" opacity="0.8"/>
    <rect x="136" y="336" width="20" height="28" rx="6" fill="#89b4fa" opacity="0.8"/>

    <rect x="356" y="148" width="20" height="28" rx="6" fill="#89b4fa" opacity="0.8"/>
    <rect x="356" y="242" width="20" height="28" rx="6" fill="#89b4fa" opacity="0.8"/>
    <rect x="356" y="336" width="20" height="28" rx="6" fill="#89b4fa" opacity="0.8"/>

    <!-- Center Play / Audio Wave Icon -->
    <polygon points="230,196 320,256 230,316" fill="url(#primary-grad)"/>

    <!-- Fast forward / Sync arrow accents -->
    <path d="M 190 380 Q 256 410 322 380" fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
