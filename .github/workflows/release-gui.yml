name: Release Linux GUI (Rust & Slint)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            gui/target/
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('gui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Build Release Binary
        run: |
          cargo build --release --manifest-path gui/Cargo.toml
          strip gui/target/release/rconv-gui

      - name: Package Standalone Linux Tarball
        run: |
          mkdir -p release-dist
          cp gui/target/release/rconv-gui release-dist/rconv-gui
          chmod +x release-dist/rconv-gui
          tar -czvf rconv-gui-linux-x86_64.tar.gz -C release-dist rconv-gui

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rconv-gui-linux-x86_64
          path: rconv-gui-linux-x86_64.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rconv-gui-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
